<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About MMB — Mohammed Muzammil Bhurani</title>
  <meta name="description" content="Mohammed Muzammil Bhurani builds websites and content with AI.">
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f6368;
      --line: #e6e6e3;
      --accent: #e57346;
      --accent-soft: #f1e2e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --card: #1a1b1e;
        --text: #f1f1f1;
        --muted: #a0a4ab;
        --line: #2a2c30;
        --accent: #edc009;
        --accent-soft: #23234a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 640px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 40px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .intro {
      margin: 0;
      font-size: 1.1rem;
      color: var(--muted);
    }
    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 36px 0;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
    }
    .contact {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .contact a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .contact a:hover,
    .contact a:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }
    .contact .label {
      font-weight: 600;
    }
    .contact .value {
      color: var(--muted);
      font-size: 0.95rem;
      overflow-wrap: anywhere;
      text-align: right;
    }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    @media (max-width: 480px) {
      .card { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="avatar" aria-hidden="true">MMB</div>
      <p class="eyebrow">About MMB</p>
      <h1>Mohammed Muzammil Bhurani</h1>
      <p class="intro">I build websites and create content using AI.</p>

      <hr>

      <h2>Contact</h2>
      <ul class="contact">
        <li>
          <a href="mailto:you@example.com">
            <span class="label">Email</span>
            <span class="value">studentyard1@gmail.com</span>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener">
            <span class="label">LinkedIn</span>
            <span class="value">linkedin.com/in/your-profile</span>
          </a>
        </li>
        <li>
          <a href="https://instagram.com/your-handle" target="_blank" rel="noopener">
            <span class="label">Instagram</span>
            <span class="value">@your-handle</span>
          </a>
        </li>
      </ul>
    </section>
    <footer>&copy; <span id="year">2026</span> Mohammed Muzammil Bhurani</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
